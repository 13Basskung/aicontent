<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="url(#bgGradient)"/>
  
  <!-- AI Content Icon - Play/Content Symbol -->
  <g transform="translate(512, 512)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="320" fill="none" stroke="url(#iconGradient)" stroke-width="40" opacity="0.3"/>
    
    <!-- Play Triangle -->
    <path d="M-100,-150 L180,0 L-100,150 Z" fill="url(#iconGradient)" transform="translate(20, 0)"/>
    
    <!-- Content Lines -->
    <rect x="-280" y="-280" width="120" height="20" rx="10" fill="url(#iconGradient)" opacity="0.8"/>
    <rect x="-280" y="-240" width="80" height="20" rx="10" fill="url(#iconGradient)" opacity="0.6"/>
    
    <!-- AI Sparkle -->
    <circle cx="220" cy="-220" r="40" fill="url(#iconGradient)"/>
    <path d="M220,-260 L220,-180 M180,-220 L260,-220" stroke="url(#bgGradient)" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Text "AI" -->
  <text x="512" y="900" font-family="Arial Black, sans-serif" font-size="120" font-weight="900" fill="white" text-anchor="middle" opacity="0.9">AI CONTENT</text>
</svg>
